<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Webpage Example</title>
    <style>
        /* Mobile-first styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 1rem;
        }

        nav {
            background-color: #333;
            display: flex;
            flex-direction: column;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 0.8rem 1rem;
            border-top: 1px solid #444;
        }

        nav a:hover {
            background-color: #555;
        }

        main {
            padding: 1rem;
        }

        section {
            margin-bottom: 1.5rem;
            background-color: #f4f4f4;
            padding: 1rem;
            border-radius: 5px;
        }

        footer {
            text-align: center;
            padding: 1rem;
            background-color: #333;
            color: white;
        }

        /* Tablet and Desktop */
        @media (min-width: 600px) {
            nav {
                flex-direction: row;
                justify-content: center;
            }

            nav a {
                border: none;
                margin: 0 1rem;
            }

            main {
                display: flex;
                gap: 1rem;
            }

            section {
                flex: 1;
            }
        }

        /* Desktop */
        @media (min-width: 1024px) {
            header {
                font-size: 2rem;
            }

            section {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        Responsive Webpage Example
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <main>
        <section>
            <h2>Section 1</h2>
            <p>This section demonstrates responsive design using flexible units and media queries.</p>
        </section>

        <section>
            <h2>Section 2</h2>
            <p>Resize the browser or open on a mobile device to see the layout change.</p>
        </section>
    </main>

    <footer>
        &copy; 2026 Responsive Webpage. All Rights Reserved.
    </footer>

</body>
</html>
