<!DOCTYPE html>
<html>
<head>
    <title>CSS Styles Example</title>

    <!-- Internal CSS -->
    <style>
        h2 {
            color: green;
            text-align: center;
        }

        p {
            color: blue;
            font-size: 16px;
        }

        .external-box {
            border: 2px solid black;
            padding: 10px;
            background-color: lightgray;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Inline CSS -->
    <h1 style="color: red; text-align: center;">
        Inline CSS Example
    </h1>

    <!-- Internal CSS -->
    <h2>Internal CSS Example</h2>
    <p>This paragraph uses internal CSS styling.</p>

    <!-- External CSS (simulated using a class) -->
    <div class="external-box">
        External CSS Example
    </div>

</body>
</html>
