<!DOCTYPE html>
<html>
<head>
    <title>CSS Types Example</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="practical2.1.css">

    <!-- Internal CSS -->
    <style>
        h2 {
            color: green;
            text-align: center;
        }

        p {
            font-size: 16px;
            color: blue;
        }
    </style>
</head>
<body>

    <h1 style="color: red; text-align: center;">
        This is Inline CSS
    </h1>

    <h2>This is Internal CSS</h2>

    <p>This paragraph is styled using internal CSS.</p>

    <div class="box">
        This div is styled using external CSS.
    </div>

</body>
</html>
