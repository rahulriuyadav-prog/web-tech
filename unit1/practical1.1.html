<!DOCTYPE html>
<html>
<head>
    <title>Basic HTML Page</title>
</head>
<body>

    <h1>Welcome to My HTML Page</h1>
    <h2>HTML Formatting Example</h2>

    <p>
        This is a <b>basic HTML page</b> created using 
        <i>heading</i>, <u>paragraph</u>, and 
        <strong>formatting tags</strong>.
    </p>

    <p>
        HTML stands for <mark>HyperText Markup Language</mark>.
        It is used to create <em>web pages</em>.
    </p>

    <p>
        This text is <small>small</small> and this text is <big>big</big>.
    </p>

</body>
</html>
