<!DOCTYPE html>
<html>
<head>
    <title>HTML Table with Merged Cells</title>
</head>
<body>

    <h1>Student Information Table</h1>

    <table border="1" align="center" cellpadding="10" cellspacing="0">
        
        <caption><b>Student Marks Report</b></caption>

        <tr align="center">
            <th rowspan="2">Roll No</th>
            <th rowspan="2">Name</th>
            <th colspan="3">Marks</th>
        </tr>

        <tr align="center">
            <th>Math</th>
            <th>Science</th>
            <th>English</th>
        </tr>

        <tr align="center">
            <td>101</td>
            <td align="left">Rahul</td>
            <td>85</td>
            <td>90</td>
            <td>88</td>
        </tr>

        <tr align="center">
            <td>102</td>
            <td align="left">Raj</td>
            <td>78</td>
            <td>82</td>
            <td>80</td>
        </tr>

        <tr>
            <td colspan="5" align="center">
                <b>End of Report</b>
            </td>
        </tr>

    </table>

</body>
</html>
