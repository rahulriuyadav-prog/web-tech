<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Basic Arithmetic</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 50px; }
        .calc-card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
        input { width: 60px; padding: 8px; margin: 5px; }
        button { padding: 8px 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>

<div class="calc-card">
    <h3>Arithmetic Operations</h3>
    
    <input type="number" id="num1" placeholder="Num 1">
    <select id="operator">
        <option value="add">+</option>
        <option value="subtract">-</option>
        <option value="multiply">*</option>
        <option value="divide">/</option>
    </select>
    <input type="number" id="num2" placeholder="Num 2">
    
    <button onclick="calculate()">Calculate</button>

    <div id="result">Result: --</div>
</div>

<script>
    function calculate() {
        // Getting values from input fields
        const n1 = parseFloat(document.getElementById('num1').value);
        const n2 = parseFloat(document.getElementById('num2').value);
        const op = document.getElementById('operator').value;
        const resultDiv = document.getElementById('result');

        // Validation: Check if inputs are numbers
        if (isNaN(n1) || isNaN(n2)) {
            resultDiv.innerHTML = "Please enter valid numbers!";
            return;
        }

        let res;

        // Performing arithmetic based on selection
        switch (op) {
            case 'add':
                res = n1 + n2;
                break;
            case 'subtract':
                res = n1 - n2;
                break;
            case 'multiply':
                res = n1 * n2;
                break;
            case 'divide':
                res = n2 !== 0 ? n1 / n2 : "Cannot divide by zero";
                break;
            default:
                res = "Unknown operation";
        }

        // Displaying the result (Task 15: DOM Manipulation)
        resultDiv.innerHTML = `Result: ${res}`;
    }
</script>

</body>
</html>
