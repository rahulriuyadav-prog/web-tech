<!DOCTYPE html>
<html>
<head>
    <title>Task 19: Canvas Drawing</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        canvas { 
            border: 2px solid #333; 
            background-color: #fcfcfc;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h2>Canvas Graphics Lab</h2>
    <canvas id="myCanvas" width="500" height="300"></canvas>
    <p>Shapes drawn using the JavaScript Canvas API</p>

    <script>
        // 1. Access the canvas and its context
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");

        // 2. Draw a Filled Rectangle
        ctx.fillStyle = "#3498db"; // Blue color
        ctx.fillRect(50, 50, 150, 100); // (x, y, width, height)

        // 3. Draw a Circle (Arc)
        ctx.beginPath(); // Start a new path
        ctx.arc(350, 100, 50, 0, Math.PI * 2); // (x, y, radius, startAngle, endAngle)
        ctx.fillStyle = "#e74c3c"; // Red color
        ctx.fill();
        ctx.closePath();

        // 4. Draw a Triangle (Custom Path)
        ctx.beginPath();
        ctx.moveTo(125, 200); // Top point
        ctx.lineTo(75, 270);  // Bottom left
        ctx.lineTo(175, 270); // Bottom right
        ctx.fillStyle = "#2ecc71"; // Green color
        ctx.fill();
        ctx.closePath();

        // 5. Add some Text
        ctx.fillStyle = "#2c3e50";
        ctx.font = "16px Arial";
        ctx.fillText("Rectangle, Circle, & Triangle", 250, 250);
    </script>

</body>
</html>
